<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Hub - Premium Key System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* Centralização Padronizada com CSS Grid e dvh */
        body {
            background-color: #09090b;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh; /* Centralização real no mobile */
            display: grid;
            place-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* LUZES DE FUNDO ANIMADAS (BLOBS) */
        .blob {
            position: fixed; /* Evita quebrar a tela no mobile */
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            pointer-events: none; /* Não atrapalha os cliques */
            animation: float 12s infinite alternate ease-in-out;
        }
        .blob-1 { width: 350px; height: 350px; background: #4f46e5; top: -10%; left: -5%; }
        .blob-2 { width: 450px; height: 450px; background: #9333ea; bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 250px; height: 250px; background: #10b981; top: 40%; left: 50%; animation-duration: 15s; opacity: 0.15; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        /* CARD PRINCIPAL (GLASSMORPHISM) */
        .card {
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 32px 24px;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* TEXTOS */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* CAIXA DE CAPTCHA */
        .captcha-container {
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .captcha-container:hover {
            background: rgba(39, 39, 42, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        /* CHECKBOX CUSTOMIZADO */
        .checkbox-wrapper {
            width: 28px;
            height: 28px;
            border: 2px solid #52525b;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            background: #09090b;
        }

        .captcha-container:hover .checkbox-wrapper { border-color: #71717a; }
        .captcha-text { font-size: 14px; font-weight: 500; color: #e4e4e7; }
        
        /* Símbolo "reCAPTCHA" Fake (Apenas visual) */
        .captcha-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .captcha-logo div {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: conic-gradient(#4f46e5, #0ea5e9, #4f46e5);
            animation: rotateLogo 4s linear infinite;
            opacity: 0.8;
        }
        .captcha-logo span { font-size: 10px; color: #71717a; font-weight: 600; }

        @keyframes rotateLogo { 100% { transform: rotate(360deg); } }

        /* LOADING ANIMATION */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(79, 70, 229, 0.2);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* SVG CHECK ANIMADO PRO */
        .checkmark-svg {
            display: none;
            width: 16px;
            height: 16px;
        }
        .checkmark-svg path {
            stroke: #10b981;
            stroke-width: 3;
            stroke-dasharray: 22;
            stroke-dashoffset: 22;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ESTADO DE SUCESSO */
        .captcha-container.success {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
            cursor: default;
            transform: translateY(0);
        }
        .captcha-container.success .checkbox-wrapper {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* BOTÃO BRILHANTE (NEON/SHINE) */
        .btn-next {
            display: none;
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Efeito de flash/luz passando pelo botão */
        .btn-next::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .btn-next:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">
        <h1>Urban Hub</h1>
        <p class="subtitle">Complete a verificação de segurança para prosseguir e gerar sua Key de acesso.</p>
        
        <div class="captcha-container" id="captchaBox" onclick="verifyHuman()">
            <div class="captcha-left">
                <div class="checkbox-wrapper" id="checkbox">
                    <div class="spinner" id="spinner"></div>
                    <svg class="checkmark-svg" id="checkmark" viewBox="0 0 24 24">
                        <path d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <span class="captcha-text" id="captchaText">Eu sou humano</span>
            </div>
            
            <div class="captcha-logo">
                <div></div>
                <span>URBAN</span>
            </div>
        </div>

        <a href="https://seulink.com/passo2" class="btn-next" id="btnContinue">GERAR KEY</a>
    </div>

    <script>
        let isVerified = false;

        function verifyHuman() {
            if (isVerified) return;

            const box = document.getElementById('captchaBox');
            const checkbox = document.getElementById('checkbox');
            const spinner = document.getElementById('spinner');
            const checkmark = document.getElementById('checkmark');
            const checkmarkPath = checkmark.querySelector('path');
            const text = document.getElementById('captchaText');
            const btn = document.getElementById('btnContinue');

            // 1. Efeito de Carregando
            checkbox.style.borderColor = 'transparent';
            spinner.style.display = 'block';
            text.innerText = 'Autenticando...';
            text.style.color = '#a1a1aa';

            // 2. Delay simulando API (1.8 segundos)
            setTimeout(() => {
                isVerified = true;
                
                // Remove spinner
                spinner.style.display = 'none';
                checkmark.style.display = 'block';
                
                // Anima o SVG desenhando o Check
                checkmarkPath.style.transition = 'stroke-dashoffset 0.5s ease-out';
                setTimeout(() => {
                    checkmarkPath.style.strokeDashoffset = '0';
                }, 10);
                
                // Estado de Sucesso
                box.classList.add('success');
                text.innerText = 'Verificado com sucesso';
                text.style.color = '#10b981';

                // Revela o botão com animação suave
                btn.style.display = 'block';
                btn.animate([
                    { opacity: 0, transform: 'translateY(15px) scale(0.95)' },
                    { opacity: 1, transform: 'translateY(0) scale(1)' }
                ], {
                    duration: 500,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                });

            }, 1800);
        }
    </script>
</body>
</html>
